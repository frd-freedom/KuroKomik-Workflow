name: Scrape KomikTap
on:
  schedule:
    - cron: '*/10 * * * *'   # tiap 15 menit
  workflow_dispatch:

concurrency:
  group: komiktap-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger server scraper
        run: |
          curl -fsS --http1.1 --max-time 30 \
            "https://kuronestudio.site.je/internal-cron.php?token=${{ secrets.CRON_TOKEN }}" \
            -o /tmp/scrape-result.json || true
          cat /tmp/scrape-result.json || echo "(tidak ada output — scraper lanjut di background)"
